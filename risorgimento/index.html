<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Novaro, Rossi e l'officina musicale del Risorgimento</title>
<meta name="description" content="Un viaggio interattivo tra inni, spartiti, ritratti, documenti e protagonisti del Risorgimento musicale italiano." />
<style>
  :root{
    --ink:#201b17;
    --paper:#f5efe3;
    --paper2:#eee3cf;
    --red:#7f1d1d;
    --blue:#253d63;
    --gold:#a5792a;
    --green:#2f5e48;
    --muted:#6c6258;
    --line:#cdbfa8;
    --shadow:0 16px 50px rgba(35,26,18,.15);
    --serif: Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;background:#d8cfbf}
  body{margin:0;color:var(--ink);background:
    radial-gradient(circle at 10% 0%, rgba(127,29,29,.06), transparent 24rem),
    radial-gradient(circle at 90% 20%, rgba(37,61,99,.08), transparent 28rem),
    linear-gradient(180deg,#e9e0d1,#d8cfbf 40%,#cec3b2);font-family:var(--serif);line-height:1.72}
  a{color:inherit}
  button{font:inherit}
  .progress{position:fixed;z-index:100;left:0;top:0;height:4px;width:0;background:linear-gradient(90deg,var(--blue),var(--red),var(--gold));box-shadow:0 0 12px rgba(127,29,29,.25)}
  .masthead{position:relative;min-height:78vh;display:grid;place-items:center;padding:7rem 1.2rem 4rem;overflow:hidden;background:#211d19;color:#f9f3e7}
  .masthead::before{content:"";position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(11,9,8,.9),rgba(11,9,8,.55) 50%,rgba(11,9,8,.82)),
    url('https://commons.wikimedia.org/wiki/Special:Redirect/file/5_giornate_di_Milano.jpeg') center/cover no-repeat;filter:saturate(.65) sepia(.18);transform:scale(1.02)}
  .masthead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(15,12,10,.86));pointer-events:none}
  .hero{position:relative;z-index:2;max-width:1100px;width:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:3rem;align-items:end}
  .kicker{font-family:var(--sans);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:#e1c58c;margin-bottom:1rem}
  h1{margin:.2rem 0 1.2rem;font-weight:600;line-height:.98;font-size:clamp(3rem,8vw,7.2rem);letter-spacing:-.045em;max-width:900px}
  .dek{font-size:clamp(1.15rem,2vw,1.6rem);max-width:760px;color:#efe4d2;line-height:1.4}
  .hero-card{border:1px solid rgba(255,255,255,.25);background:rgba(28,24,21,.68);backdrop-filter:blur(8px);padding:1.3rem;border-radius:2px;box-shadow:var(--shadow)}
  .hero-card small{font-family:var(--sans);text-transform:uppercase;letter-spacing:.12em;color:#d8c29a}
  .hero-card p{font-size:1.04rem;margin:.6rem 0 0}
  .shell{max-width:1380px;margin:0 auto;background:var(--paper);box-shadow:0 0 70px rgba(34,28,20,.14)}
  .nav-wrap{position:sticky;top:0;z-index:40;background:rgba(245,239,227,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font-family:var(--sans)}
  nav{max-width:1240px;margin:auto;display:flex;gap:.4rem;overflow:auto;padding:.55rem .8rem;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{white-space:nowrap;text-decoration:none;padding:.65rem .8rem;border-radius:999px;font-size:.83rem;font-weight:700;color:#5b5147}
  nav a.active,nav a:hover{background:#2b261f;color:#fff}
  .content{max-width:1180px;margin:auto;padding:4.5rem 1.4rem 7rem}
  .intro-grid{display:grid;grid-template-columns:1.45fr .55fr;gap:3.5rem;margin-bottom:5rem;align-items:start}
  .lead{font-size:1.43rem;line-height:1.58;margin-top:0}

</body>
</html>
