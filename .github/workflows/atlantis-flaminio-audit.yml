name: Atlantis Flaminio audit
on:
  push:
    branches: [audit-flaminio-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Baseline regression
        run: node musurgia-atlantis/audit-integrazione/TEST_COLLAUDO_Q5_HEAD_2026-11-28.mjs
      - name: Full payload integration
        run: node musurgia-atlantis/audit-integrazione/fase2/TEST_COLLAUDO_FLAMINIO.mjs
