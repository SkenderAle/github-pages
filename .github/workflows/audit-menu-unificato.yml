name: Audit menu unificato (Chromium)
on:
  push:
    branches: [main]
    paths:
      - 'shared/mm-menu-unificato-v1.css'
      - 'index.html'
      - '**/index.html'
      - 'shared/modernita-percorsi-v1.css'
      - 'rinascimento/approfondimenti.css'
      - 'assets/atlante-menu-gerarchico-pagine.js'
      - 'shared/mm-menu-posizione-v1.js'
      - 'medioevo/style.css'
      - 'medioevo/index.html'
      - 'romanticismo/destino-provvidenza/index.html'
      - 'shared/mm-menu-compatto-v1.js'
      - 'shared/mm-menu-dossier-v1.js'
      - 'shared/atlas-autonav-v1.js'
      - 'shared/atlas-anchor-arrival-v1.js'
      - 'scripts/audit-menu-unificato.cjs'
      - 'scripts/audit-menu-dominio.cjs'
      - '.github/workflows/audit-menu-unificato.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Usa Chrome del runner
        run: |
          npm install --no-save playwright@1.58.2
          google-chrome --version
      - name: Avvia il sito locale
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mm-menu-server.log 2>&1 &
          sleep 2
      - name: Verifica tutti gli indici su desktop e mobile
        run: node scripts/audit-menu-unificato.cjs
      - name: Verifica il dominio pubblico su Chromium mobile e desktop
        run: node scripts/audit-menu-dominio.cjs
      - name: Allega risultati e schermate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-menu-desktop-mobile
          if-no-files-found: ignore
          path: |
            audit-menu-report.json
            audit-menu-screenshots/
            audit-menu-live-report.json
            audit-menu-live-screenshots/
