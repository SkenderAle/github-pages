name: Musurgia — integrità audit relazionale

on:
  push:
    branches: [main]
    paths:
      - "atlante3d/database/grafo.json"
      - "atlante3d/database/relazioni.json"
      - "atlante3d/database/verifica-audit-semantico-scuole.mjs"
      - "atlante3d/database/verifica-audit-relazionale.mjs"
      - "atlante3d/database/verifica-frasi-scuole.mjs"
      - "atlante3d/app-livelli.js"
      - ".github/workflows/musurgia-audit-relazionale.yml"
  pull_request:
    paths:
      - "atlante3d/database/grafo.json"
      - "atlante3d/database/relazioni.json"
      - "atlante3d/database/verifica-audit-semantico-scuole.mjs"
      - "atlante3d/database/verifica-audit-relazionale.mjs"
      - "atlante3d/database/verifica-frasi-scuole.mjs"
      - "atlante3d/app-livelli.js"
      - ".github/workflows/musurgia-audit-relazionale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    name: Controllo strutturale e anti-regressione
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Controllo audit inverso e archivi
        run: node atlante3d/database/verifica-audit-relazionale.mjs
      - name: Controllo semantico scuole e tradizioni
        run: node atlante3d/database/verifica-audit-semantico-scuole.mjs
      - name: Sintassi e controllo delle frasi della lente Scuole
        run: |
          node --check atlante3d/app-livelli.js
          node atlante3d/database/verifica-frasi-scuole.mjs --tsv
      - name: Conserva le 784 frasi dell’audit
        uses: actions/upload-artifact@v4
        with:
          name: musurgia-frasi-scuole
          path: audit-frasi-scuole.tsv
