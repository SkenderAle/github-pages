function buildArchive(overlay,a2,a3){
 const unique=(items,key)=>{const m=new Map(items.map(x=>[key(x),x]));if(m.size!==items.length)throw Error("ID duplicati");return m};
 const a=unique(a3.records,x=>x.source_id),b=unique(a2.rows,x=>x.source_id),parents=unique(a3.parent_proposals,x=>x.id);
 const refs=new Map();for(const e of overlay.links){if(e.visibility!=="documentary")throw Error("Arco non documentario");if(!refs.has(e.source))refs.set(e.source,[]);refs.get(e.source).push(e)}
 const rows=overlay.nodes.map(n=>{if(n.visibility!=="documentary"||n.category!=="documentazione")throw Error("Nodo non documentario");const p=n.provenance[0],q=a.get(p.original_id);if(!q||q.approved_musical_edge||q.taxonomy_approved||p.payload.id_sorgente!==q.source_id||q.source_url!==p.payload.link_spiegazione)throw Error("Incoerenza "+p.original_id);return {id:p.original_id,row:q.row,title:p.payload.brano_originale,author:p.payload.compositore,number:p.payload.numero_originale,original:p.payload,audit:q,a2:b.get(p.original_id)||null,parent:parents.get(q.parent_candidate)||null,references:refs.get(n.id)||[]}});

function searchArchive(rows,{query="",author="",category="",status=""}={}){

}
const $=id=>document.getElementById(id);let rows=[],filtered=[],page=0,selected=null;const PAGE=25;

async function load(){try{const results=[];for(const [key,file,expected] of pins){$("state").textContent="Verifica "+key+"…";const r=await fetch("musurgia-atlantis/audit-integrazione/fase2/"+file,{cache:"no-store"});if(!r.ok)throw Error(file+" HTTP "+r.status);const bytes=new Uint8Array(await r.arrayBuffer()),head=new TextEncoder().encode("blob "+bytes.length+"\0"),buf=new Uint8Array(head.length+bytes.length);buf.set(head);buf.set(bytes,head.length);const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-1",buf)),x=>x.toString(16).padStart(2,"0")).join("");if(hash!==expected)throw Error("Impronta non corrispondente: "+file);results.push(JSON.parse(new TextDecoder().decode(bytes)))}rows=buildArchive(...results);for(const [id,values] of [["author",rows.map(r=>r.author)],["category",rows.map(r=>r.audit.classification_candidate||"Da classificare")]])for(const value of [...new Set(values)].sort((a,b)=>a.localeCompare(b,"it"))){const o=el("option",value);o.value=value;$(id).append(o)}$("state").textContent="500 schede · 3 file verificati · archivio documentario";update()}catch(e){$("state").textContent="Errore: "+e.message;$("state").className="warning"}}
for(const id of ["q","author","category","status"])$(id).addEventListener(id==="q"?"input":"change",update);$("prev").onclick=()=>{page--;render()};$("next").onclick=()=>{page++;render()};$("archiveTab").onclick=()=>{$("archive").hidden=false;$("graph").hidden=true};$("graphTab").onclick=()=>{$("archive").hidden=true;$("graph").hidden=false;const frame=$("frame");if(!frame.getAttribute("src"))frame.src="musurgia-atlantis/audit-integrazione/VISTA_DB_FEDERATO_Q7B_CANDIDATO_2026-11-28.html"};load();</script></body></html>
